name: CI

on:
  push:
    branches: [main, agent/mobile-battle-workflow]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check static JavaScript syntax
        run: |
          node --check public/battle.js
          node --check public/party.js
          node --check public/history.js
          node --check public/team-editor.js

      - name: Run checks
        run: npm run check
