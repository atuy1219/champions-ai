<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Pokémon Champions向けの行動候補をPokémon Showdownデータで近似評価するWeb UI"
    >
    <title>Champions AI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">EARLY MVP</p>
          <h1>Champions AI</h1>
          <p>
            Pokémon ShowdownのChampions modを使い、入力した4技を
            タイプ相性・一致補正・天候・補助性能から順位付けします。
          </p>
        </div>
        <div id="status-text" class="status-pill">接続確認中…</div>
      </header>

      <section class="workspace">
        <form id="analyze-form" class="panel form-panel">
          <div class="section-heading">
            <h2>盤面入力</h2>
            <p>現段階では1対1の簡易評価です。</p>
          </div>

          <label>
            フォーマットID
            <input
              name="formatId"
              value="gen9championsvgc2026regma"
              autocomplete="off"
              required
            >
          </label>

          <div class="two-column">
            <fieldset>
              <legend>自分</legend>
              <label>
                ポケモン
                <input name="attackerSpecies" value="Garchomp" required>
              </label>
              <label>
                HP %
                <input name="attackerHp" type="number" min="0" max="100" value="100" required>
              </label>
              <label>
                素早さランク
                <input name="attackerSpeedStage" type="number" min="-6" max="6" value="0" required>
              </label>
            </fieldset>

            <fieldset>
              <legend>相手</legend>
              <label>
                ポケモン
                <input name="defenderSpecies" value="Incineroar" required>
              </label>
              <label>
                HP %
                <input name="defenderHp" type="number" min="0" max="100" value="100" required>
              </label>
              <label>
                素早さランク
                <input name="defenderSpeedStage" type="number" min="-6" max="6" value="0" required>
              </label>
            </fieldset>
          </div>

          <fieldset>
            <legend>自分の技</legend>
            <div class="move-grid">
              <input name="move1" value="Earthquake" placeholder="技1" required>
              <input name="move2" value="Dragon Claw" placeholder="技2">
              <input name="move3" value="Protect" placeholder="技3">
              <input name="move4" value="Swords Dance" placeholder="技4">
            </div>
          </fieldset>

          <div class="two-column compact">
            <label>
              天候
              <select name="weather">
                <option value="none">なし</option>
                <option value="sun">晴れ</option>
                <option value="rain">雨</option>
                <option value="sand">砂嵐</option>
                <option value="snow">雪</option>
              </select>
            </label>

            <label>
              おいかぜ
              <select name="tailwind">
                <option value="none">なし</option>
                <option value="attacker">自分側</option>
                <option value="defender">相手側</option>
                <option value="both">両方</option>
              </select>
            </label>
          </div>

          <button id="submit-button" type="submit">候補手を評価</button>
          <p id="error-box" class="error-box" role="alert"></p>
        </form>

        <section class="panel results-panel">
          <div class="section-heading">
            <h2>候補手</h2>
            <p>得点は比較用のヒューリスティック値です。</p>
          </div>
          <div id="results" class="empty-state">
            盤面を入力して「候補手を評価」を押してください。
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
