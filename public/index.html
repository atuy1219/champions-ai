<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Pokémon Champions向けの行動候補をPokémon Showdownデータで近似評価するWeb UI"
    >
    <title>Champions AI</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">EARLY MVP</p>
          <h1>Champions AI</h1>
          <p>
            日本語のポケモン名・技名をShowdown内部IDへ変換し、HP、能力ランク、
            天候・フィールド・壁・行動順を含めて候補手を近似評価します。
          </p>
        </div>
        <div id="status-text" class="status-pill">接続確認中…</div>
      </header>

      <form id="analyze-form" class="workspace">
        <section class="panel form-panel">
          <div class="section-heading">
            <h2>盤面入力</h2>
            <p>現段階では1対1の簡易評価です。日本語・英語の両方で入力できます。</p>
          </div>

          <label>
            フォーマットID
            <input
              name="formatId"
              value="gen9championsvgc2026regma"
              autocomplete="off"
              required
            >
          </label>

          <div class="two-column pokemon-columns">
            <fieldset class="pokemon-card">
              <legend>自分</legend>
              <label>
                ポケモン
                <input
                  name="attackerSpecies"
                  value="ガブリアス"
                  autocomplete="off"
                  data-autocomplete="species"
                  required
                >
              </label>
              <label>
                状態異常
                <select name="attackerStatus">
                  <option value="none">なし</option>
                  <option value="burn">やけど</option>
                  <option value="poison">どく</option>
                  <option value="toxic">もうどく</option>
                  <option value="paralysis">まひ</option>
                  <option value="sleep">ねむり</option>
                  <option value="freeze">こおり</option>
                </select>
              </label>

              <div class="hp-editor">
                <span class="field-label">HP</span>
                <div class="hp-grid">
                  <label>
                    現在値
                    <input name="attackerCurrentHp" type="number" min="0" value="183" required>
                  </label>
                  <label>
                    最大値
                    <input name="attackerMaxHp" type="number" min="1" value="183" required>
                  </label>
                  <output id="attacker-hp-percent" class="hp-percent">100.0%</output>
                </div>
              </div>

              <fieldset class="nested-fieldset">
                <legend>技</legend>
                <div class="move-grid">
                  <input name="move1" value="じしん" data-autocomplete="moves" autocomplete="off" required>
                  <input name="move2" value="ドラゴンクロー" data-autocomplete="moves" autocomplete="off">
                  <input name="move3" value="まもる" data-autocomplete="moves" autocomplete="off">
                  <input name="move4" value="つるぎのまい" data-autocomplete="moves" autocomplete="off">
                </div>
              </fieldset>

              <details>
                <summary>能力ランク</summary>
                <div class="stage-grid" data-stage-owner="attacker">
                  <label>攻撃<select name="attacker-atk" data-stage></select></label>
                  <label>防御<select name="attacker-def" data-stage></select></label>
                  <label>特攻<select name="attacker-spa" data-stage></select></label>
                  <label>特防<select name="attacker-spd" data-stage></select></label>
                  <label>素早さ<select name="attacker-spe" data-stage></select></label>
                  <label>命中<select name="attacker-accuracy" data-stage></select></label>
                  <label>回避<select name="attacker-evasion" data-stage></select></label>
                </div>
              </details>
            </fieldset>

            <fieldset class="pokemon-card">
              <legend>相手</legend>
              <label>
                ポケモン
                <input
                  name="defenderSpecies"
                  value="ガオガエン"
                  autocomplete="off"
                  data-autocomplete="species"
                  required
                >
              </label>
              <label>
                状態異常
                <select name="defenderStatus">
                  <option value="none">なし</option>
                  <option value="burn">やけど</option>
                  <option value="poison">どく</option>
                  <option value="toxic">もうどく</option>
                  <option value="paralysis">まひ</option>
                  <option value="sleep">ねむり</option>
                  <option value="freeze">こおり</option>
                </select>
              </label>
              <label>
                HP %
                <input name="defenderHp" type="number" min="0" max="100" step="0.1" value="100" required>
              </label>

              <details>
                <summary>能力ランク</summary>
                <div class="stage-grid" data-stage-owner="defender">
                  <label>攻撃<select name="defender-atk" data-stage></select></label>
                  <label>防御<select name="defender-def" data-stage></select></label>
                  <label>特攻<select name="defender-spa" data-stage></select></label>
                  <label>特防<select name="defender-spd" data-stage></select></label>
                  <label>素早さ<select name="defender-spe" data-stage></select></label>
                  <label>命中<select name="defender-accuracy" data-stage></select></label>
                  <label>回避<select name="defender-evasion" data-stage></select></label>
                </div>
              </details>
            </fieldset>
          </div>

          <fieldset class="field-panel">
            <legend>場の状態</legend>
            <div class="field-grid">
              <label>
                天候
                <select name="weather">
                  <option value="none">なし</option>
                  <option value="sun">晴れ</option>
                  <option value="rain">雨</option>
                  <option value="sand">砂嵐</option>
                  <option value="snow">雪</option>
                </select>
              </label>
              <label>
                フィールド
                <select name="terrain">
                  <option value="none">なし</option>
                  <option value="electric">エレキ</option>
                  <option value="grassy">グラス</option>
                  <option value="misty">ミスト</option>
                  <option value="psychic">サイコ</option>
                </select>
              </label>
              <label class="check-control">
                <input name="trickRoom" type="checkbox">
                トリックルーム
              </label>
            </div>

            <div class="side-condition-grid">
              <fieldset class="nested-fieldset">
                <legend>自分側</legend>
                <div class="checkbox-grid">
                  <label><input name="attackerTailwind" type="checkbox">おいかぜ</label>
                  <label><input name="attackerReflect" type="checkbox">リフレクター</label>
                  <label><input name="attackerLightScreen" type="checkbox">ひかりのかべ</label>
                  <label><input name="attackerAuroraVeil" type="checkbox">オーロラベール</label>
                </div>
              </fieldset>
              <fieldset class="nested-fieldset">
                <legend>相手側</legend>
                <div class="checkbox-grid">
                  <label><input name="defenderTailwind" type="checkbox">おいかぜ</label>
                  <label><input name="defenderReflect" type="checkbox">リフレクター</label>
                  <label><input name="defenderLightScreen" type="checkbox">ひかりのかべ</label>
                  <label><input name="defenderAuroraVeil" type="checkbox">オーロラベール</label>
                </div>
              </fieldset>
            </div>
          </fieldset>

          <button id="submit-button" type="submit">候補手を評価</button>
          <p id="error-box" class="error-box" role="alert"></p>
        </section>

        <section class="panel results-panel">
          <div class="section-heading">
            <h2>候補手</h2>
            <p>得点は比較用のヒューリスティック値です。</p>
          </div>
          <div id="results" class="empty-state">
            盤面を入力して「候補手を評価」を押してください。
          </div>
        </section>
      </form>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
