<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Pokémon Champions対戦セッションの履歴と入出力">
  <title>履歴 - Champions AI</title>
  <link rel="stylesheet" href="./mobile-app.css">
</head>
<body class="mobile-app" data-page="history">
  <main class="mobile-shell">
    <header class="mobile-header">
      <div><h1>履歴・管理</h1><p>対戦中に不要な操作をまとめた画面</p></div>
      <span id="live-status" class="connection-pill">起動中…</span>
    </header>

    <div class="screen-stack">
      <section class="mobile-card">
        <div class="card-heading"><div><h2>現在のセッション</h2><p>対戦名、ターン、イベント数、記録済み判断</p></div></div>
        <div id="session-summary" class="empty-message">読み込み中…</div>
      </section>

      <section class="mobile-card">
        <div class="card-heading"><div><h2>対戦結果</h2><p>対戦終了後に勝敗とメモを保存</p></div></div>
        <div class="compact-grid">
          <label>結果
            <select id="result">
              <option value="win">勝ち</option><option value="loss">負け</option>
              <option value="draw">引き分け</option><option value="cancelled">中断</option>
              <option value="unknown" selected>未設定</option>
            </select>
          </label>
          <label class="wide">メモ
            <textarea id="notes" rows="4" placeholder="相手構築、判断ミス、改善点など"></textarea>
          </label>
          <button id="finish" class="wide" type="button">結果を保存</button>
        </div>
      </section>

      <section class="mobile-card">
        <div class="card-heading"><div><h2>データ管理</h2><p>対戦JSONの保存・読込、入力の取消</p></div></div>
        <div class="compact-grid">
          <button id="export" type="button">JSON保存</button>
          <button id="import" class="secondary" type="button">JSON読込</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
          <button id="undo" class="secondary" type="button">最後の入力を戻す</button>
          <button id="new-session" class="secondary" type="button">新しい対戦</button>
          <button id="reset" class="danger wide" type="button">現在の盤面を初期化</button>
        </div>
      </section>

      <section class="mobile-card">
        <div class="card-heading"><div><h2>直近の入力</h2><p>自動推測を含むBattleEvent</p></div></div>
        <div id="event-list" class="action-group"></div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>
  <nav class="bottom-nav" aria-label="メインメニュー">
    <a href="./battle.html"><span>⚔</span>対戦</a>
    <a href="./party.html"><span>◉</span>パーティー</a>
    <a class="active" href="./history.html"><span>▤</span>履歴</a>
    <a href="./live.html"><span>⚙</span>詳細</a>
  </nav>

  <script type="module" src="./live.js"></script>
  <script type="module" src="./history.js"></script>
</body>
</html>
